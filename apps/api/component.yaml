apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: api
  description: The Fastify app (one Cloudflare Worker serving it through the runtime's Node.js HTTP server support, booted at startup, per environment)
spec:
  type: cloudflare-worker-turbo
  lifecycle: production
  owner: platform
  # Its pages, attached to it in the workspace's catalog: what the Docs
  # library shows for it, and what the catalog's docs and runbook checks read.
  # Generated from what this manifest and its sources declare.
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture, title: Architecture }
      - { path: docs/runbook.md, role: runbook, title: Runbook }
  # `app`, not `api`: a domain and a component share one name space in the
  # catalog, and a domain called `api` would take this component's place in
  # it — the API missing from its own catalog.
  domain: app
  path: apps/api
  # No dependsOn: the API reads no wiring and binds nothing, so there is no
  # infra component to deploy before it. A component under infra/ that this
  # Worker comes to read wiring from goes here, `mode: enforced` on
  # github-push-main and advisory on pull requests, so one convergence applies
  # it first.
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  # How the API runs itself for orun.work's live Preview tab
  # (saas-parallel-baselining PB4): `orun preview` starts this, and a coding
  # session keeps it running while it works, so the person watches it change
  # as it is built. The dev server binds the box's loopback only, on a fixed
  # port, and installs first, so a checkout the session has not installed yet
  # still comes up.
  # Fastify runs inside the Worker, and its / is the template's welcome page,
  # so the tab opens it. wrangler dev runs the Worker in workerd with its
  # local vars, and reloads it on every edit (each reload boots Fastify again,
  # at startup, as a deploy does).
  preview:
    run:
      - sh
      - -c
      - pnpm install --frozen-lockfile --prefer-offline --filter "@app/api..." && exec node_modules/.bin/wrangler dev --ip 127.0.0.1 --port 8787 --show-interactive-dev-session=false
    port: 8787
    path: /
    env:
      WRANGLER_SEND_METRICS: "false"
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"

    workspaceDir: ../..
    appDir: .

    turboFilter: "@app/api"
    # Committed, not rendered: the Worker binds nothing, so there are no
    # resource IDs to wire, and the lanes' structure check (`test -f`, before
    # any build) finds it in a fresh checkout. Per-env names come from `--env`:
    # fastify-api-api-{stage,prod}.
    wranglerConfig: wrangler.jsonc

    installCommand: pnpm install --frozen-lockfile
    buildCommand: pnpm exec turbo run build --filter=@app/api
    typecheckCommand: pnpm exec turbo run typecheck --filter=@app/api

    dryRunCommand: pnpm exec wrangler deploy --dry-run --config wrangler.jsonc --env prod
    deployCommand: pnpm exec wrangler deploy --config wrangler.jsonc --env prod

    preDeployCommand: "echo 'No pre-deploy step configured.'"
    migrationCommand: "echo 'No migrations configured.'"
    # Smoke: /health answers `"status":"ok"` for THIS environment — the
    # environment comes from the `env.<name>` vars the deploy used, so a stale
    # or wrong Worker fails it. Not the API's name, which is the owner's to
    # change. The Worker composition exports no deployed URL, so the command
    # names its own workers.dev URL; ${DEPLOYED_URL} overrides it (a custom
    # domain, or a local `wrangler dev`). ${ORUN_ENVIRONMENT} the runner sets
    # for every step. The body is buffered before grep so an early match cannot
    # SIGPIPE curl.
    smokeCommand: 'base="${DEPLOYED_URL:-https://fastify-api-api-${ORUN_ENVIRONMENT}.vijayakrishnan12994.workers.dev}" && health="$(curl -sf --max-time 20 "${base}/health")" && echo "${health}" | grep -q "\"status\":\"ok\"" && echo "${health}" | grep -q "\"environment\":\"${ORUN_ENVIRONMENT}\""'
  labels:
    team: platform
    layer: runtime
    surface: api
    runtime: cloudflare
